# Required for AndroidX-only consumers like billing-ktx (no support
# for the legacy `com.android.support` namespace anymore).
android.useAndroidX=true

# Suppress AGP's "you have AndroidX deps but no androidx kotlin extensions"
# noise; we don't ship Kotlin extensions of our own.
android.nonTransitiveRClass=true

# Match the in-repo Kotlin version. AGP 8.5.x stops complaining at 1.9.x.
kotlin.code.style=official
